<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Monstrinhos — Match 3</title>
<style>
  :root {
    --bg1: #2b1055;
    --bg2: #7597de;
    --panel: rgba(255, 255, 255, 0.14);
    --panel-border: rgba(255, 255, 255, 0.35);
    --ink: #fff;
    --accent: #ffd166;
    --cell: rgba(255, 255, 255, 0.10);
    --cell-sel: rgba(255, 255, 255, 0.40);
    --gap: 6px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 14px;
    gap: 12px;
    min-height: 100%;
    user-select: none;
  }

  /* floating bubbles background */
  .bubbles { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .bubbles span {
    position: absolute;
    bottom: -120px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    animation: rise linear infinite;
  }
  @keyframes rise {
    to { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
  }

  header { z-index: 1; text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(26px, 7vw, 40px);
    letter-spacing: 1px;
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
  }
  h1 .pop { color: var(--accent); }
  .subtitle { margin: 2px 0 0; opacity: 0.8; font-size: 13px; }

  .hud {
    z-index: 1;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 8px 16px;
    min-width: 84px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.75; }
  .stat .value { font-size: 24px; font-weight: 700; line-height: 1.1; }
  .stat.warn .value { color: #ff8a8a; }

  #board-wrap {
    z-index: 1;
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: var(--gap);
    backdrop-filter: blur(6px);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    touch-action: none;
  }

  #board {
    display: grid;
    gap: var(--gap);
  }

  .cell {
    background: var(--cell);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
  }
  .cell.sel {
    background: var(--cell-sel);
    box-shadow: 0 0 0 3px var(--accent) inset;
  }

  .monster {
    width: 86%;
    height: 86%;
    transition: transform 0.18s ease, opacity 0.18s ease;
    will-change: transform, opacity;
    filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.25));
  }
  .monster.pop { animation: pop 0.26s ease forwards; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    100% { transform: scale(0); opacity: 0; }
  }
  .monster.drop { animation: drop 0.3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes drop {
    from { transform: translateY(-26px); opacity: 0.2; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .cell.shake .monster { animation: shake 0.3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px) rotate(-6deg); }
    75% { transform: translateX(4px) rotate(6deg); }
  }
  /* idle wobble for personality */
  .monster .face { transform-box: fill-box; transform-origin: center; }

  .controls { z-index: 1; display: flex; gap: 10px; }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--bg1);
    background: var(--accent);
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
    transition: transform 0.08s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); }
  button.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--panel-border); }

  /* floating score popups */
  .float {
    position: absolute;
    font-weight: 800;
    font-size: 20px;
    color: var(--accent);
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
    pointer-events: none;
    animation: floatup 0.9s ease forwards;
    z-index: 5;
  }
  @keyframes floatup {
    to { transform: translateY(-46px) scale(1.2); opacity: 0; }
  }

  /* overlay (game over / win) */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(20, 6, 50, 0.7);
    backdrop-filter: blur(4px);
  }
  .overlay.show { display: flex; animation: fade 0.3s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .card {
    background: linear-gradient(160deg, #3a1d6e, #5a78c9);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    padding: 30px 34px;
    text-align: center;
    max-width: 320px;
    box-shadow: 0 22px 60px rgba(0,0,0,.5);
  }
  .card h2 { margin: 0 0 6px; font-size: 30px; }
  .card p { margin: 6px 0 18px; opacity: 0.9; }
  .card .big { font-size: 44px; font-weight: 800; color: var(--accent); }
</style>
</head>
<body>
  <div class="bubbles" id="bubbles"></div>

  <header>
    <h1>Monstr<span class="pop">inhos</span></h1>
    <p class="subtitle">junte 3 ou mais monstrinhos iguais 👾</p>
  </header>

  <div class="hud">
    <div class="stat"><div class="label">Pontos</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">Meta</div><div class="value" id="goal">2000</div></div>
    <div class="stat" id="movesStat"><div class="label">Jogadas</div><div class="value" id="moves">20</div></div>
  </div>

  <div id="board-wrap">
    <div id="board"></div>
  </div>

  <div class="controls">
    <button id="restart" class="ghost">Reiniciar</button>
    <button id="shuffle">Embaralhar</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="ov-title">Fim!</h2>
      <p id="ov-msg">Você fez</p>
      <div class="big" id="ov-score">0</div>
      <p id="ov-sub"></p>
      <button id="ov-again">Jogar de novo</button>
    </div>
  </div>

<script>
/* ============================================================
   Monstrinhos — match-3
   Tudo em um arquivo. Sem dependências.
   ============================================================ */

const SIZE = 8;            // tabuleiro 8x8
const TYPES = 6;           // 6 monstrinhos
const START_MOVES = 20;
const GOAL = 2000;
const BASE_POINTS = 30;    // por monstrinho removido

// Paletas e "cara" de cada tipo de monstrinho
const MONSTERS = [
  { name: "rosa",   body: "#ff6fae", dark: "#d63384", eyes: 2, mouth: "smile",  shape: "blob"  },
  { name: "verde",  body: "#5fd38a", dark: "#1f9d57", eyes: 1, mouth: "open",   shape: "round" },
  { name: "azul",   body: "#5aa9ff", dark: "#2563eb", eyes: 2, mouth: "fang",   shape: "tall"  },
  { name: "amarelo",body: "#ffd24a", dark: "#e6a700", eyes: 3, mouth: "smile",  shape: "round" },
  { name: "roxo",   body: "#b482ff", dark: "#7c3aed", eyes: 2, mouth: "open",   shape: "blob"  },
  { name: "laranja",body: "#ff9248", dark: "#ea6c0c", eyes: 1, mouth: "fang",   shape: "tall"  },
];

// ---- SVG de cada monstrinho (cara fofa, varia por tipo) ----
function monsterSVG(t) {
  const m = MONSTERS[t];
  const g = `mg${t}`;
  // corpo conforme shape
  let body;
  if (m.shape === "round") {
    body = `<circle cx="50" cy="54" r="40" fill="url(#${g})"/>`;
  } else if (m.shape === "tall") {
    body = `<rect x="16" y="14" width="68" height="78" rx="30" fill="url(#${g})"/>`;
  } else { // blob
    body = `<path d="M50 12 C78 12 90 34 88 56 C86 80 72 92 50 92 C28 92 14 80 12 56 C10 34 22 12 50 12 Z" fill="url(#${g})"/>`;
  }

  // chifrinhos / antenas pra dar charme
  const horns = `
    <path d="M30 18 L24 4 L38 14 Z" fill="${m.dark}"/>
    <path d="M70 18 L76 4 L62 14 Z" fill="${m.dark}"/>`;

  // olhos
  let eyes = "";
  const eyeWhite = (cx, cy, r) =>
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff"/>
     <circle cx="${cx+1}" cy="${cy+1}" r="${r*0.45}" fill="#222"/>
     <circle cx="${cx-r*0.3}" cy="${cy-r*0.3}" r="${r*0.18}" fill="#fff"/>`;
  if (m.eyes === 1) {
    eyes = eyeWhite(50, 48, 15);
  } else if (m.eyes === 2) {
    eyes = eyeWhite(37, 46, 11) + eyeWhite(63, 46, 11);
  } else {
    eyes = eyeWhite(33, 46, 8) + eyeWhite(50, 42, 9) + eyeWhite(67, 46, 8);
  }

  // boca
  let mouth = "";
  if (m.mouth === "smile") {
    mouth = `<path d="M38 66 Q50 78 62 66" stroke="${m.dark}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  } else if (m.mouth === "open") {
    mouth = `<ellipse cx="50" cy="70" rx="10" ry="8" fill="${m.dark}"/>
             <ellipse cx="50" cy="73" rx="5" ry="4" fill="#ff7d9c"/>`;
  } else { // fang
    mouth = `<path d="M38 66 Q50 76 62 66 L58 66 L56 72 L52 66 L48 72 L44 66 Z" fill="${m.dark}"/>`;
  }

  return `
  <svg class="monster" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="${g}" cx="40%" cy="35%" r="75%">
        <stop offset="0%" stop-color="${tint(m.body, 0.35)}"/>
        <stop offset="100%" stop-color="${m.body}"/>
      </radialGradient>
    </defs>
    <g class="face">
      ${horns}
      ${body}
      ${eyes}
      ${mouth}
    </g>
  </svg>`;
}

// clareia uma cor hex
function tint(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r + (255 - r) * amt);
  g = Math.round(g + (255 - g) * amt);
  b = Math.round(b + (255 - b) * amt);
  return `rgb(${r},${g},${b})`;
}

// ---- Estado ----
let grid = [];       // grid[r][c] = tipo (0..TYPES-1)
let cells = [];      // referências aos elementos .cell
let score = 0;
let moves = START_MOVES;
let busy = false;    // bloqueia input durante animações
let selected = null; // {r,c}
let gameOver = false;

const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const movesEl = document.getElementById("moves");
const goalEl  = document.getElementById("goal");

// ---- Helpers de grid ----
const rand = () => Math.floor(Math.random() * TYPES);
const inBounds = (r, c) => r >= 0 && r < SIZE && c >= 0 && c < SIZE;

function makeGridNoMatches() {
  const g = [];
  for (let r = 0; r < SIZE; r++) {
    g[r] = [];
    for (let c = 0; c < SIZE; c++) {
      let t;
      do {
        t = rand();
      } while (
        (c >= 2 && g[r][c-1] === t && g[r][c-2] === t) ||
        (r >= 2 && g[r-1][c] === t && g[r-2][c] === t)
      );
      g[r][c] = t;
    }
  }
  return g;
}

// ---- Render ----
function buildBoard() {
  boardEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
  // tamanho da célula responsivo
  const maxBoard = Math.min(window.innerWidth - 36, 460);
  const cellSize = Math.floor((maxBoard - (SIZE + 1) * 6) / SIZE);
  document.documentElement.style.setProperty("--gap", "6px");
  boardEl.innerHTML = "";
  cells = [];
  for (let r = 0; r < SIZE; r++) {
    cells[r] = [];
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.width = cellSize + "px";
      cell.style.height = cellSize + "px";
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.innerHTML = monsterSVG(grid[r][c]);
      attachInput(cell);
      boardEl.appendChild(cell);
      cells[r][c] = cell;
    }
  }
}

function setCell(r, c, type, dropAnim) {
  grid[r][c] = type;
  const cell = cells[r][c];
  cell.innerHTML = monsterSVG(type);
  if (dropAnim) cell.firstElementChild.classList.add("drop");
}

// ---- Input: clique e arraste ----
let dragStart = null;

function attachInput(cell) {
  cell.addEventListener("pointerdown", (e) => {
    if (busy || gameOver) return;
    dragStart = { r: +cell.dataset.r, c: +cell.dataset.c, x: e.clientX, y: e.clientY };
  });

  cell.addEventListener("pointerup", (e) => {
    if (busy || gameOver || !dragStart) return;
    const r = +cell.dataset.r, c = +cell.dataset.c;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    const moved = Math.abs(dx) > 12 || Math.abs(dy) > 12;

    if (moved) {
      // arraste: direção dominante
      let tr = dragStart.r, tc = dragStart.c;
      if (Math.abs(dx) > Math.abs(dy)) tc += dx > 0 ? 1 : -1;
      else tr += dy > 0 ? 1 : -1;
      trySwap(dragStart.r, dragStart.c, tr, tc);
      clearSelection();
    } else {
      // clique
      handleTap(r, c);
    }
    dragStart = null;
  });

  cell.addEventListener("pointercancel", () => { dragStart = null; });
}

function handleTap(r, c) {
  if (!selected) {
    selectCell(r, c);
  } else if (selected.r === r && selected.c === c) {
    clearSelection();
  } else if (isAdjacent(selected, { r, c })) {
    const s = selected;
    clearSelection();
    trySwap(s.r, s.c, r, c);
  } else {
    clearSelection();
    selectCell(r, c);
  }
}

function selectCell(r, c) {
  selected = { r, c };
  cells[r][c].classList.add("sel");
}
function clearSelection() {
  if (selected) cells[selected.r][selected.c].classList.remove("sel");
  selected = null;
}
function isAdjacent(a, b) {
  return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
}

// ---- Troca ----
async function trySwap(r1, c1, r2, c2) {
  if (!inBounds(r2, c2)) return;
  busy = true;

  swapData(r1, c1, r2, c2);
  redrawSwap(r1, c1, r2, c2);
  await wait(180);

  const matches = findMatches();
  if (matches.size === 0) {
    // sem combinação: desfaz com "shake"
    cells[r1][c1].classList.add("shake");
    cells[r2][c2].classList.add("shake");
    await wait(280);
    cells[r1][c1].classList.remove("shake");
    cells[r2][c2].classList.remove("shake");
    swapData(r1, c1, r2, c2);
    redrawSwap(r1, c1, r2, c2);
    busy = false;
    return;
  }

  moves--;
  movesEl.textContent = moves;
  await resolveCascades();
  busy = false;
  checkEnd();
}

function swapData(r1, c1, r2, c2) {
  const tmp = grid[r1][c1];
  grid[r1][c1] = grid[r2][c2];
  grid[r2][c2] = tmp;
}
function redrawSwap(r1, c1, r2, c2) {
  cells[r1][c1].innerHTML = monsterSVG(grid[r1][c1]);
  cells[r2][c2].innerHTML = monsterSVG(grid[r2][c2]);
}

// ---- Detecção de combinações ----
function findMatches() {
  const matched = new Set();
  // horizontais
  for (let r = 0; r < SIZE; r++) {
    let run = 1;
    for (let c = 1; c <= SIZE; c++) {
      if (c < SIZE && grid[r][c] === grid[r][c-1]) {
        run++;
      } else {
        if (run >= 3) for (let k = c - run; k < c; k++) matched.add(r * SIZE + k);
        run = 1;
      }
    }
  }
  // verticais
  for (let c = 0; c < SIZE; c++) {
    let run = 1;
    for (let r = 1; r <= SIZE; r++) {
      if (r < SIZE && grid[r][c] === grid[r-1][c]) {
        run++;
      } else {
        if (run >= 3) for (let k = r - run; k < r; k++) matched.add(k * SIZE + c);
        run = 1;
      }
    }
  }
  return matched;
}

// ---- Resolve cascatas (remove, cai, reabastece, repete) ----
async function resolveCascades() {
  let combo = 0;
  while (true) {
    const matches = findMatches();
    if (matches.size === 0) break;
    combo++;

    // pontuação (combo aumenta o multiplicador)
    const gained = matches.size * BASE_POINTS * combo;
    score += gained;
    scoreEl.textContent = score;

    // popup de pontos no centro aproximado
    showFloat(matches, gained, combo);

    // animação de "pop"
    matches.forEach((idx) => {
      const r = Math.floor(idx / SIZE), c = idx % SIZE;
      const mon = cells[r][c].firstElementChild;
      if (mon) mon.classList.add("pop");
    });
    await wait(260);

    // remove (marca -1) e aplica gravidade
    matches.forEach((idx) => {
      grid[Math.floor(idx / SIZE)][idx % SIZE] = -1;
    });
    applyGravity();
    await wait(300);
  }
}

function applyGravity() {
  for (let c = 0; c < SIZE; c++) {
    // coleta os sobreviventes de baixo pra cima
    let writeRow = SIZE - 1;
    for (let r = SIZE - 1; r >= 0; r--) {
      if (grid[r][c] !== -1) {
        grid[writeRow][c] = grid[r][c];
        if (writeRow !== r) grid[r][c] = -1;
        writeRow--;
      }
    }
    // preenche o topo com novos monstrinhos
    for (let r = writeRow; r >= 0; r--) {
      grid[r][c] = rand();
    }
  }
  // redesenha a coluna inteira com animação de queda
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      cells[r][c].innerHTML = monsterSVG(grid[r][c]);
      cells[r][c].firstElementChild.classList.add("drop");
    }
  }
}

// ---- Popup flutuante de pontos ----
function showFloat(matches, gained, combo) {
  // posição média das peças combinadas
  let sumR = 0, sumC = 0;
  matches.forEach((idx) => { sumR += Math.floor(idx / SIZE); sumC += idx % SIZE; });
  const r = Math.round(sumR / matches.size);
  const c = Math.round(sumC / matches.size);
  const cell = cells[r][c];
  const wrap = document.getElementById("board-wrap");
  const f = document.createElement("div");
  f.className = "float";
  f.textContent = (combo > 1 ? "x" + combo + " " : "+") + gained;
  f.style.left = cell.offsetLeft + cell.offsetWidth / 2 - 20 + "px";
  f.style.top = cell.offsetTop + "px";
  wrap.appendChild(f);
  setTimeout(() => f.remove(), 900);
}

// ---- Embaralhar (quando não há jogadas / botão) ----
function shuffleBoard() {
  if (busy || gameOver) return;
  do {
    grid = makeGridNoMatches();
  } while (!hasPossibleMove());
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      cells[r][c].innerHTML = monsterSVG(grid[r][c]);
      cells[r][c].firstElementChild.classList.add("drop");
    }
}

// existe alguma troca que gera combinação?
function hasPossibleMove() {
  const test = (r1, c1, r2, c2) => {
    if (!inBounds(r2, c2)) return false;
    swapData(r1, c1, r2, c2);
    const ok = findMatches().size > 0;
    swapData(r1, c1, r2, c2);
    return ok;
  };
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (test(r, c, r, c + 1)) return true;
      if (test(r, c, r + 1, c)) return true;
    }
  return false;
}

// ---- Fim de jogo ----
function checkEnd() {
  if (score >= GOAL) {
    return finish(true);
  }
  if (moves <= 0) {
    return finish(false);
  }
  // sem jogadas possíveis -> embaralha automaticamente
  if (!hasPossibleMove()) {
    shuffleBoard();
  }
  const ms = document.getElementById("movesStat");
  ms.classList.toggle("warn", moves <= 5);
}

function finish(won) {
  gameOver = true;
  document.getElementById("ov-title").textContent = won ? "Você venceu! 🎉" : "Fim de jogo";
  document.getElementById("ov-msg").textContent = won ? "Meta batida com" : "Sua pontuação:";
  document.getElementById("ov-score").textContent = score;
  document.getElementById("ov-sub").textContent = won
    ? "Mandou bem, treinador de monstrinhos!"
    : (score >= GOAL * 0.7 ? "Quase lá! Tenta de novo 💪" : "Bora de novo!");
  document.getElementById("overlay").classList.add("show");
}

// ---- Util ----
const wait = (ms) => new Promise((res) => setTimeout(res, ms));

// ---- Início / reinício ----
function newGame() {
  score = 0;
  moves = START_MOVES;
  gameOver = false;
  selected = null;
  busy = false;
  scoreEl.textContent = 0;
  movesEl.textContent = moves;
  goalEl.textContent = GOAL;
  document.getElementById("movesStat").classList.remove("warn");
  document.getElementById("overlay").classList.remove("show");
  do {
    grid = makeGridNoMatches();
  } while (!hasPossibleMove());
  buildBoard();
}

document.getElementById("restart").addEventListener("click", newGame);
document.getElementById("ov-again").addEventListener("click", newGame);
document.getElementById("shuffle").addEventListener("click", () => {
  if (moves > 0 && !gameOver) shuffleBoard();
});

// rebuild ao girar/redimensionar
let resizeT;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { if (!busy) buildBoard(); }, 200);
});

// bolhas de fundo
(function makeBubbles() {
  const wrap = document.getElementById("bubbles");
  for (let i = 0; i < 12; i++) {
    const s = document.createElement("span");
    const size = 20 + Math.random() * 70;
    s.style.width = s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "%";
    s.style.animationDuration = 8 + Math.random() * 12 + "s";
    s.style.animationDelay = -Math.random() * 12 + "s";
    wrap.appendChild(s);
  }
})();

newGame();
</script>
